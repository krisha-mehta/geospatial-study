<body>

    </label>

<script>

const CONFIG = {
  MOE_Z: 1.645,
  RAW_MIN: 4,
  RAW_MAX: 22
};

const svg = d3.select('#map');
const svgLegend = d3.select('#legend');
const gFill = svg.append('g');
const gOutline = svg.append('g');

const SIGMA_MAX  = 12;
const RAMP_FLOOR = 0.25;          // skip YlOrRd's near-white yellow end

const color = d3.scaleSequential(
    t => d3.interpolateYlOrRd(RAMP_FLOOR + t * (1 - RAMP_FLOOR))
  ).domain([CONFIG.RAW_MIN, CONFIG.RAW_MAX]).clamp(true);

function vsupColor(pov, sigma) {
  const u = Math.max(0, Math.min(1, sigma / SIGMA_MAX));
  return d3.interpolateRgb(color(pov), '#ffffff')(0.75 * u);   // alpha 1 -> 0.25
}

const projection = d3.geoEquirectangular();
const path = d3.geoPath(projection);

const norm = s => (s||"").normalize("NFD").replace(/\p{Diacritic}/gu,"").toLowerCase().trim();
const stripTypeSuffix = (s) => s.replace(/\b(county|parish|borough|census area|municipio|municipality)\b/gi, "").replace(/\s+/g, " ").trim();

let stateCounties, byFips;

// Fixed shrinkage target: a domain-chosen reference poverty rate, rather than
// an empirical grand mean across counties.
const GLOBAL_THETA = 14.5;
function getGlobalTheta() {
  return GLOBAL_THETA;
}

const GLOBAL_TAU_MOE = 5;
const SHRINKAGE_FACTOR = 3;

function getTau2(z) {
  const tauSe = (GLOBAL_TAU_MOE / z) * SHRINKAGE_FACTOR;
  return tauSe * tauSe;
}

function shrinkValue(rawValue, se, theta, tau2) {
  if (!(tau2 > 0) || !isFinite(tau2)) return theta;
  if (!(se > 0) || !isFinite(se)) return rawValue;
  const priorPrecision = 1 / tau2;
  const obsPrecision = 1 / (se * se);
  return (priorPrecision * theta + obsPrecision * rawValue) / (priorPrecision + obsPrecision);
}

// Here is the main logic for svsup. Each county's poverty estimate is pulled toward
// a fixed reference point (theta = GLOBAL_THETA, a fixed reference poverty rate),
// with the pull strength governed by the ratio of observation variance (from the
// margin of error) to a fixed prior variance (tau2, from GLOBAL_TAU_MOE).
// Higher-uncertainty counties shrink more, while low uncertainty counties stay close
// to their original estimates.
function computeShrinkage(theta){
  const z = CONFIG.MOE_Z;
  const records = Array.from(byFips.values());
  const n = records.length;
  if (n === 0) return;

  const tau2 = getTau2(z);

  for (const rec of records){
    const se = (rec.moe ?? 0) / z;
    rec.sigma = se;
    rec.povAdj = shrinkValue(rec.pov, se, theta, tau2);
  }
}

function renderLegend(theta){
  svgLegend.selectAll('*').remove();

  const z = CONFIG.MOE_Z;
  const tau2 = getTau2(z);

  const N_VALUE_BINS = 40;
  const N_SE_BINS = 40;
  const SE_MIN = 0;
  const SE_MAX = SIGMA_MAX;
  const SWEEP_DEG = 70;
  const OUTER_RADIUS = 135;
  const APEX = { x: 100, y: 200 };

  const sweepRad = SWEEP_DEG * Math.PI / 180;
  const angleScale = d3.scaleLinear()
      .domain([0, N_VALUE_BINS])
      .range([-sweepRad / 2, sweepRad / 2]);
  const valueAtBin = i => CONFIG.RAW_MIN + (i + 0.5) / N_VALUE_BINS * (CONFIG.RAW_MAX - CONFIG.RAW_MIN);
  const seAtRadius = r => SE_MAX - (r / OUTER_RADIUS) * (SE_MAX - SE_MIN);

  const cells = [];
  for (let i = 0; i < N_VALUE_BINS; i++) {
    const rawValue = valueAtBin(i);
    for (let j = 0; j < N_SE_BINS; j++) {
      const rInner = j * (OUTER_RADIUS / N_SE_BINS);
      const rOuter = (j + 1) * (OUTER_RADIUS / N_SE_BINS);
      const se = seAtRadius((rInner + rOuter) / 2);
      cells.push({
        startAngle: angleScale(i),
        endAngle: angleScale(i + 1),
        innerRadius: rInner,
        outerRadius: rOuter,
        fill: vsupColor(shrinkValue(rawValue, se, theta, tau2), se)
      });
    }
  }

  const arcGen = d3.arc();
  const gCone = svgLegend.append('g')
      .attr('transform', `translate(${APEX.x}, ${APEX.y})`)
      .style('pointer-events', 'none');

  gCone.selectAll('path')
    .data(cells)
    .join('path')
      .attr('d', arcGen)
      .attr('fill', d => d.fill);

  const valueToAngle = d3.scaleLinear()
      .domain([CONFIG.RAW_MIN, CONFIG.RAW_MAX])
      .range([-sweepRad / 2, sweepRad / 2]);
  const valueTicks = d3.scaleLinear().domain([CONFIG.RAW_MIN, CONFIG.RAW_MAX]).ticks(5);
  gCone.selectAll('.value-tick')
    .data(valueTicks)
    .join('text')
      .attr('class', 'value-tick')
      .attr('font-size', 9)
      .attr('text-anchor', 'middle')
      .attr('x', d => (OUTER_RADIUS + 10) * Math.sin(valueToAngle(d)))
      .attr('y', d => -(OUTER_RADIUS + 10) * Math.cos(valueToAngle(d)))
      .text(d => d);

  // Standard-error ticks along the fan's left edge.
  const seTickRadii = d3.range(0, N_SE_BINS + 1, N_SE_BINS / 4).map(j => j * (OUTER_RADIUS / N_SE_BINS));
  const edgeAngle = -sweepRad / 2;
  gCone.selectAll('.se-tick')
    .data(seTickRadii)
    .join('text')
      .attr('class', 'se-tick')
      .attr('font-size', 9)
      .attr('text-anchor', 'end')
      .attr('x', d => d * Math.sin(edgeAngle) - 4)
      .attr('y', d => -d * Math.cos(edgeAngle) + 3)
      .text(d => seAtRadius(d).toFixed(0));

  svgLegend.append('text')
    .attr('x', 100)
    .attr('y', 20)
    .attr('font-weight', 500)
    .attr('font-size', 11)
    .attr('text-anchor', 'middle')
    .text('Shrunk Poverty Rate');

  svgLegend.append('text')
    .attr('x', 100)
    .attr('y', 34)
    .attr('font-size', 9)
    .attr('text-anchor', 'middle')
    .attr('fill', '#666')
    .text('angle: pov rate (%) · radius: standard error (%)');
}

function renderState(stateFips, csvFile) {
  Promise.all([
    Promise.all([
      d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/counties-10m.json"),
      d3.csv(csvFile, d3.autoType)
    ]),
    getGlobalTheta()
  ])
  .then(([results, theta]) => {
    const usTopo = results[0];
    const csv = results[1];

    const allCounties = topojson.feature(usTopo, usTopo.objects.counties).features;
    stateCounties = allCounties.filter(f => String(f.id).startsWith(stateFips));
    const stateFeature = topojson.feature(usTopo, usTopo.objects.states).features.find(f => String(f.id) === stateFips);

    const nameToFipsMap = new Map();
    for (const f of stateCounties) {
      const id  = String(f.id);
      const raw = f.properties?.name ?? "";
      const base = norm(stripTypeSuffix(raw));
      nameToFipsMap.set(base, id);

      if (/\bsaint\b/i.test(raw)) {
        nameToFipsMap.set(norm(stripTypeSuffix(raw.replace(/\bsaint\b/gi, "st"))), id);
        nameToFipsMap.set(norm(stripTypeSuffix(raw.replace(/\bsaint\b/gi, "st."))), id);
      }
      if (/\bst[.]?\b/iu.test(raw)) {
        nameToFipsMap.set(norm(stripTypeSuffix(raw.replace(/\bst[.]?\b/giu, "saint"))), id);
      }
    }

    byFips = new Map();
    for (const r of csv) {
      const rawName = String(r.county ?? r.NAME ?? "");
      const key = norm(stripTypeSuffix(rawName));
      const fips = nameToFipsMap.get(key);
      if (fips) {
        byFips.set(fips, { pov:+r.pov, moe:+r.moe, name: rawName });
      } else {
        console.warn(`No FIPS match for county name: "${rawName}" in state FIPS ${stateFips}`);
      }
    }

    projection.fitSize([400, 400], {type:"FeatureCollection", features: stateCounties});

    svg.selectAll('*').interrupt();
    gFill.selectAll('*').remove();
    gOutline.selectAll('*').remove();

    gOutline.append('path')
      .datum(stateFeature)
      .attr('class', 'state-outline')
      .attr('d', path);

    computeShrinkage(theta);

    gFill.selectAll('path.county')
      .data(stateCounties)
      .join('path')
        .attr('class', 'county')
        .attr('d', path)
        .attr('fill', d => {
          const rec = byFips.get(String(d.id));
          return rec ? vsupColor(rec.povAdj, rec.sigma) : '#ccc';
        });

    renderLegend(theta);
  })
  .catch(err => {
    console.error('Error loading data:', err);
    alert("Data load failed: " + err.message + ". Check console for details.");
  });
}

const stateFips = '08';
const csvFile = '../Data/COData4.csv';
renderState(stateFips, csvFile);

const responseTextarea = document.getElementById('response-text');

function postAllAnswers() {
  const hasResponse = responseTextarea.value.trim().length > 0;
  const hasStates = selectedStates.length > 0;
  const hasAge = selectedAge.length > 0;
  const hasGender = selectedGender.length > 0;
  Revisit.postAnswers({
    // Only mark the required field as filled when all questions are answered
    svsupSurveyResponse: (hasResponse && hasStates && hasAge && hasGender) ? responseTextarea.value : '',
    familiarStates: selectedStates,
    ageResponse: selectedAge,
    genderResponse: selectedGender,
  });
}

responseTextarea.addEventListener('input', () => {
  postAllAnswers();
});

let selectedAge = '';
let selectedGender = '';

document.querySelectorAll('input[name="age-response"]').forEach(radio => {
  radio.addEventListener('change', () => {
    selectedAge = radio.value;
    postAllAnswers();
  });
});

const genderSelfDescribeRadio = document.getElementById('gender-self-describe-radio');
const genderSelfDescribeInput = document.getElementById('gender-self-describe-input');

document.querySelectorAll('input[name="gender-response"]').forEach(radio => {
  radio.addEventListener('change', () => {
    if (radio.value === 'Prefer to self-describe') {
      genderSelfDescribeInput.disabled = false;
      genderSelfDescribeInput.focus();
      selectedGender = genderSelfDescribeInput.value.trim();
    } else {
      genderSelfDescribeInput.disabled = true;
      genderSelfDescribeInput.value = '';
      selectedGender = radio.value;
    }
    postAllAnswers();
  });
});

genderSelfDescribeInput.addEventListener('input', () => {
  if (genderSelfDescribeRadio.checked) {
    selectedGender = genderSelfDescribeInput.value.trim();
    postAllAnswers();
  }
});

Revisit.postAnswers({ svsupSurveyResponse: '', familiarStates: [], ageResponse: '', genderResponse: '' });

const FIPS_TO_STATE = {
  "01": "Alabama", "02": "Alaska", "04": "Arizona", "05": "Arkansas", "06": "California",
  "08": "Colorado", "09": "Connecticut", "10": "Delaware", "12": "Florida", "13": "Georgia",
  "15": "Hawaii", "16": "Idaho", "17": "Illinois", "18": "Indiana", "19": "Iowa",
  "20": "Kansas", "21": "Kentucky", "22": "Louisiana", "23": "Maine", "24": "Maryland",
  "25": "Massachusetts", "26": "Michigan", "27": "Minnesota", "28": "Mississippi", "29": "Missouri",
  "30": "Montana", "31": "Nebraska", "32": "Nevada", "33": "New Hampshire", "34": "New Jersey",
  "35": "New Mexico", "36": "New York", "37": "North Carolina", "38": "North Dakota", "39": "Ohio",
  "40": "Oklahoma", "41": "Oregon", "42": "Pennsylvania", "44": "Rhode Island", "45": "South Carolina",
  "46": "South Dakota", "47": "Tennessee", "48": "Texas", "49": "Utah", "50": "Vermont",
  "51": "Virginia", "53": "Washington", "54": "West Virginia", "55": "Wisconsin", "56": "Wyoming"
};

const stateNameForFeature = d => FIPS_TO_STATE[String(d.id).padStart(2, "0")];

let selectedStates = [];

const selectedStatesContainer = document.getElementById('selected-states');
const selectionInfo = document.getElementById('selection-info');
const usMapSvg = d3.select('#us-map');
const usMapWidth = 660, usMapHeight = 400;
const mapTooltip = document.getElementById('map-tooltip');
const usMapWrap = document.querySelector('.us-map-wrap');

function showMapTooltip(event, name) {
  const rect = usMapWrap.getBoundingClientRect();
  mapTooltip.textContent = name;
  mapTooltip.style.left = `${event.clientX - rect.left}px`;
  mapTooltip.style.top = `${event.clientY - rect.top}px`;
  mapTooltip.style.opacity = '1';
}

function hideMapTooltip() {
  mapTooltip.style.opacity = '0';
}

function updateMapSelection() {
  usMapSvg.selectAll('path.us-state')
    .classed('selected', d => selectedStates.includes(stateNameForFeature(d)));
}

async function initUSMap() {
  const us = await d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json");
  const stateFeatures = topojson.feature(us, us.objects.states).features
    .filter(f => stateNameForFeature(f));

  const albersProjection = d3.geoAlbersUsa()
    .fitSize([usMapWidth, usMapHeight], { type: "FeatureCollection", features: stateFeatures });
  const albersPath = d3.geoPath(albersProjection);

  usMapSvg.attr('viewBox', `0 0 ${usMapWidth} ${usMapHeight}`);

  usMapSvg.selectAll('path.us-state')
    .data(stateFeatures, d => d.id)
    .join('path')
    .attr('class', 'us-state')
    .attr('d', albersPath)
    .attr('data-state', stateNameForFeature)
    .on('mouseenter mousemove', function(event, d) {
      showMapTooltip(event, stateNameForFeature(d));
    })
    .on('mouseleave', hideMapTooltip)
    .on('click', function(event, d) {
      toggleState(stateNameForFeature(d));
    });

  updateMapSelection();
}

function toggleState(state) {
  if (selectedStates.includes(state)) {
    removeState(state);
  } else {
    addState(state);
  }
}

function renderSelectedStates() {
  selectedStatesContainer.innerHTML = '';

  selectedStates.forEach(state => {
    const tag = document.createElement('span');
    tag.className = 'state-tag';
    tag.innerHTML = `
      ${state}
      <button type="button" aria-label="Remove ${state}" data-state="${state}">&times;</button>
    `;
    selectedStatesContainer.appendChild(tag);
  });

  selectedStatesContainer.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const stateToRemove = btn.dataset.state;
      removeState(stateToRemove);
    });
  });
}

function updateSelectionInfo() {
  selectionInfo.textContent = `${selectedStates.length} state${selectedStates.length !== 1 ? 's' : ''} selected`;
}

function addState(state) {
  if (state && !selectedStates.includes(state)) {
    selectedStates.push(state);
    renderSelectedStates();
    updateSelectionInfo();
    updateMapSelection();
    postStatesAnswer();
  }
}

function removeState(state) {
  selectedStates = selectedStates.filter(s => s !== state);
  renderSelectedStates();
  updateSelectionInfo();
  updateMapSelection();
  postStatesAnswer();
}

function postStatesAnswer() {
  postAllAnswers();
}

// Initialize
initUSMap().catch(e => {
  console.error(e);
  alert('US map failed to load. Check console for details.');
});
updateSelectionInfo();
</script>
</body>
</html>
